<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <title>CCC - Add Check</title>
</head>
<body class="container">
    <nav>
        <ul><li><strong>Crystal Clear Checking</strong></li></ul>
        <ul><li><a href="/">Cancel</a></li></ul>
    </nav>
    <main>
        <article>
            <header>Record a Paper Check</header>
            <form action="/add-check" method="post">
                <div class="grid">
                    <label for="check_number">
                        Check #
                        <input type="text" id="check_number" name="check_number" placeholder="102" required>
                    </label>
                    <label for="date">
                        Date
                        <input type="date" id="date" name="date" required>
                    </label>
                </div>

                <label for="description">Description</label>
                <input type="text" id="description" name="description" placeholder="Post Office, Landlord, etc." required>

                <label for="amount">Amount ($)</label>
                <input type="number" id="amount" name="amount" step="0.01" placeholder="0.00" required>

                <button type="submit">Save to Ledger</button>
            </form>
        </article>
    </main>
</body>
</html>
